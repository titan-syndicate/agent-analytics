apiVersion: v1
kind: Namespace
metadata:
  name: agent-analytics-lab
  labels:
    app.kubernetes.io/part-of: agent-analytics-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: agent-analytics-lab
  labels:
    app.kubernetes.io/part-of: agent-analytics-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-analytics-lgtm
  template:
    metadata:
      labels:
        app: agent-analytics-lgtm
        app.kubernetes.io/part-of: agent-analytics-lab
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: loki
              mountPath: /loki
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 5Gi
        - name: loki
          emptyDir:
            sizeLimit: 1Gi
